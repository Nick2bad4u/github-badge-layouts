# SonarCloud project identity
sonar.organization = nick2bad4u
sonar.projectKey = Nick2bad4u_github-badge-layouts
sonar.projectName = github-badge-layouts
sonar.host.url = https://sonarcloud.io

# The shipped code includes the Pages application, catalog builder, and CLI API.
sonar.sources = docs,scripts,src
sonar.tests = test
sonar.test.inclusions = test/**/*.test.ts
sonar.exclusions = \
    docs/catalog.\
    js,src/generated/**,**/node_modules/**,**/dist/**,**/coverage/**,**/reports/\
    **,**/temp/**,**/*.config.*
sonar.cpd.exclusions = docs/catalog.js,src/generated/**

sonar.typescript.file.suffixes = .ts,.tsx,.mts,.cts
sonar.javascript.file.suffixes = .js,.jsx,.mjs,.cjs
sonar.typescript.tsconfigPaths = \
    tsconfig.json,tsconfig.build.json,tsconfig.eslint.json,tsconfig.js.\
    json,tsconfig.vitest-typecheck.json

sonar.javascript.lcov.reportPaths = coverage/lcov.info
sonar.coverage.exclusions = \
    docs/catalog.js,src/generated/**,src/cli.ts,src/types.ts

sonar.sourceEncoding = UTF-8
sonar.scm.provider = git
sonar.javascript.detectBundles = true
sonar.qualitygate.wait = true

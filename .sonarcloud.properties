# Additional configuration for SonarQube Cloud Automatic Analysis.
# Unlike sonar-project.properties, this file is honored by Automatic Analysis.

# Explicit roots keep the test directory outside the source scope while still
# analyzing the GitHub Actions workflows as first-class repository code.
sonar.sources = .github,docs,scripts,src

# Keep generated mirrors out of issue and duplication analysis. The canonical
# source for both files is library.md via scripts/build-site.mjs.
sonar.exclusions = docs/catalog.js,src/generated/catalog.ts
sonar.cpd.exclusions = docs/catalog.js,src/generated/catalog.ts

# Classify the repository test directory without importing coverage. Automatic
# Analysis does not support coverage reports; Codecov remains authoritative.
sonar.tests = test
sonar.sourceEncoding = UTF-8
